# EasyWalp CI — one file does everything.
#
#   * Every branch push          -> pytest on Linux + Windows, and the pinned
#                                  photocraft-cli is rebuilt & staged on the
#                                  `photocraft-bin` branch (download ready binaries).
#   * Actions > "Run workflow"   -> full release: builds photocraft-cli (pinned commit
#     (type a version,             in config/photocraft-pin.json), the PyInstaller app,
#     e.g. 0.1.0)                  the Inno Setup installer, then creates the tag and
#                                  publishes EasyWalp-Setup-<version>-windows.zip to Releases.
#   * Pushing a v* tag           -> the same release pipeline (version from the tag).
name: EasyWalp CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0) — used when run manually"
        required: false
        default: ""
      android_abis:
        description: "Android ABIs for the APK (arm64-v8a, arm64-v8a,x86, ...)"
        required: false
        default: "arm64-v8a"
      android_emulator:
        description: "Also run the on-device self-test on an Android emulator (needs x86 in android_abis)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write    # releases, tags, the photocraft-bin branch
  checks: write      # CI logs are republished as check-run annotations (see below)

concurrency:
  # A branch push, a tag push and a manual release are independent: they only share
  # the caches, not the queue (this is a public repo, so minutes are free). A newer
  # push to the *same* ref supersedes the older run - but never a release, which
  # lives in its own group.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # --------------------------------------------------------------- tests
  tests:
    name: pytest (${{ matrix.os }})
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Linux GUI deps (offscreen Qt)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (offscreen)
        id: pytests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          python -m pytest -q -rs > pytest-output.txt 2>&1
          STATUS=$?
          tail -60 pytest-output.txt
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      # The raw job log lives on a signed Azure URL that is not reachable from every
      # environment, so failures are republished as check-run annotations + a commit
      # comment -> `gh api repos/<repo>/check-runs/<id>/annotations`.
      - name: Publish the pytest log
        if: steps.pytests.outputs.status != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/ci/publish_log.py --file pytest-output.txt \
            --job-name "pytest (${{ matrix.os }})" --title "pytest (${{ matrix.os }})" || true

      # The Android/Kivy screens need a real GL context, so they get their own run
      # on a virtual X server with Mesa's software renderer.
      # The Kivy screens are *not* tested here: every GL backend segfaults when
      # Kivy creates textures under Xvfb. They are built and driven on a real
      # Android runtime instead - see the `ui_screens` step of android-selftest.
      - name: Fail if the tests failed
        if: steps.pytests.outputs.status != '0'
        shell: bash
        run: |
          echo "::error::pytest exited with ${{ steps.pytests.outputs.status }}"
          exit 1

  # ------------------------------------------------- ready engine binaries
  engine-binaries:
    name: Build photocraft-cli (pinned, ${{ matrix.platform }})
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'branch')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            binary: photocraft-cli
          - os: windows-latest
            platform: windows-x64
            binary: photocraft-cli.exe
    steps:
      - name: Checkout EasyWalp
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read PhotoCraft pin
        id: pin
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const pin = JSON.parse(fs.readFileSync("config/photocraft-pin.json", "utf8")).photocraft;
            for (const [k, v] of Object.entries({ repo: pin.repo, commit: pin.commit, tag: pin.tag, fonts_repo: pin.craft_fonts_repo, fonts_ref: pin.craft_fonts_ref }))
              fs.appendFileSync(process.env.GITHUB_OUTPUT, k + "=" + v + "\n");
          '

      - name: Install Linux GUI/font dev packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev

      - name: Check out PhotoCraft (pinned) and craft-fonts (pinned)
        shell: bash
        run: |
          git clone --no-checkout "https://github.com/${{ steps.pin.outputs.repo }}.git" ../photocraft-src
          git -C ../photocraft-src checkout --detach ${{ steps.pin.outputs.commit }}
          git clone "https://github.com/${{ steps.pin.outputs.fonts_repo }}.git" ../craft-fonts
          git -C ../craft-fonts checkout --detach ${{ steps.pin.outputs.fonts_ref }}

      - name: Cache Rust build (keyed by the pin)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ../photocraft-src/target
          key: photocraft-${{ steps.pin.outputs.commit }}-${{ runner.os }}
          restore-keys: photocraft-${{ runner.os }}

      - name: Build photocraft-cli (release)
        shell: bash
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/../craft-fonts
        run: |
          cd ../photocraft-src
          cargo build --release --locked -p photocraft-cli
          cp "target/release/${{ matrix.binary }}" "$GITHUB_WORKSPACE/${{ matrix.binary }}"

      - name: Smoke test the binary
        shell: bash
        run: |
          "./${{ matrix.binary }}" --version
          "./${{ matrix.binary }}" commands --json --filter replaceContents | head -40

      - name: Collect artefacts
        shell: bash
        run: |
          mkdir -p "photocraft-${{ steps.pin.outputs.tag }}-${{ matrix.platform }}"
          cp "${{ matrix.binary }}" "photocraft-${{ steps.pin.outputs.tag }}-${{ matrix.platform }}/"
          cp ../photocraft-src/LICENSE-MIT ../photocraft-src/LICENSE-APACHE ../photocraft-src/NOTICE ../photocraft-src/ATTRIBUTION.md \
             "photocraft-${{ steps.pin.outputs.tag }}-${{ matrix.platform }}/" 2>/dev/null || true

      - name: Upload artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: photocraft-cli-${{ steps.pin.outputs.tag }}-${{ matrix.platform }}
          path: photocraft-${{ steps.pin.outputs.tag }}-${{ matrix.platform }}/

  stage-binaries:
    name: Stage binaries on photocraft-bin branch
    needs: engine-binaries
    runs-on: ubuntu-24.04
    env:
      BIN_BRANCH: photocraft-bin
    steps:
      - name: Checkout EasyWalp
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fetch artefacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p staged
          for asset in $(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[] | select(.expired == false) | .archive_download_url'); do
            name=$(basename "$asset")
            gh api "$asset" > "$name.zip"
            unzip -o -q "$name.zip" -d staged/
            rm "$name.zip"
          done
          find staged -maxdepth 2 -type d | sort
          find staged -name "photocraft-cli*" -o -name "*.sha256" | sort

      - name: Push to staging branch
        shell: bash
        run: |
          PIN=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("config/photocraft-pin.json","utf8")).photocraft.tag)')
          git config user.name "easywalp-ci"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin $BIN_BRANCH || true
          if git ls-remote --exit-code origin "refs/heads/$BIN_BRANCH" >/dev/null 2>&1; then
            git checkout -B $BIN_BRANCH origin/$BIN_BRANCH
          else
            git checkout --orphan $BIN_BRANCH
            git rm -rf --quiet . || true
          fi
          rm -rf binaries
          mkdir -p binaries
          cp -a staged/. binaries/
          cat > binaries/BUILD-INFO.md <<EOF
          # EasyWalp PhotoCraft binary staging

          Auto-generated by the "EasyWalp CI" workflow — do not edit, do not commit to main.

          - Source: storytold/photocraft
          - Tag: $PIN (exact commit in config/photocraft-pin.json on the source branch)
          - Built: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          - Licenses: LICENSE-MIT, LICENSE-APACHE, NOTICE (redistributable under either license)
          EOF
          git add -A binaries
          git commit -m "Stage photocraft-cli $PIN binaries [skip ci]" || echo "nothing to commit"
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push --force origin $BIN_BRANCH

  # ------------------------------------------- android engine (probe/build)
  # Cross-compiles the pinned PhotoCraft engine for Android and hands the result to
  # the APK job. The engine ships as `libphotocraft_cli.so` per ABI so that the APK's
  # native-library directory (the only place Android lets an app exec() from) can run it.
  engine-android:
    name: Build photocraft-cli (pinned, android)
    # runs for tags too: the APK is part of every release
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # Escape hatch: extra `cargo build` flags for the cross-build. cargo-ndk's
      # library mode has a quirk around multi-target builds (it can stop after
      # "No usable artifacts produced by cargo"), so the two ABI builds are driven
      # one target at a time below - see "Bundle the engine libraries the APK needs".
      CARGO_NDK_EXTRA_BUILD_ARGS: ""
    steps:
      - name: Checkout EasyWalp
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read PhotoCraft pin
        id: pin
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const pin = JSON.parse(fs.readFileSync("config/photocraft-pin.json", "utf8")).photocraft;
            for (const [k, v] of Object.entries({ repo: pin.repo, commit: pin.commit, tag: pin.tag, fonts_repo: pin.craft_fonts_repo, fonts_ref: pin.craft_fonts_ref }))
              fs.appendFileSync(process.env.GITHUB_OUTPUT, k + "=" + v + "\n");
          '

      - name: Locate the Android NDK
        id: ndk
        shell: bash
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            NDK=$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/ndk/* 2>/dev/null | sort -V | tail -1)
          fi
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then echo "::error::no Android NDK found on the runner"; exit 1; fi
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "path=$NDK" >> "$GITHUB_OUTPUT"
          echo "using NDK: $NDK ($(cat "$NDK/source.properties" | tr '\n' ' '))"

      - name: Install Rust (stable + Android targets)
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add aarch64-linux-android i686-linux-android
          rustc --version && cargo --version

      - name: Install cargo-ndk
        shell: bash
        run: cargo install cargo-ndk --locked

      - name: Check out PhotoCraft (pinned) and craft-fonts (pinned)
        shell: bash
        run: |
          git clone --no-checkout "https://github.com/${{ steps.pin.outputs.repo }}.git" ../photocraft-src
          git -C ../photocraft-src checkout --detach ${{ steps.pin.outputs.commit }}
          git clone "https://github.com/${{ steps.pin.outputs.fonts_repo }}.git" ../craft-fonts
          git -C ../craft-fonts checkout --detach ${{ steps.pin.outputs.fonts_ref }}

      - name: Cache Rust build (keyed by the pin)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ../photocraft-src/target
          key: photocraft-${{ steps.pin.outputs.commit }}-android
          restore-keys: photocraft-android

      - name: Cross-compile photocraft-cli
        id: build
        shell: bash
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/../craft-fonts
        run: |
          set +e
          (
            cd ../photocraft-src
            cargo ndk -t arm64-v8a -t x86 -o "$GITHUB_WORKSPACE/engines-android" \
              build --release --locked -p photocraft-cli
          ) > android-build.log 2>&1
          STATUS=$?
          tail -80 android-build.log
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      # Android can only *execute* a file that is a native library, so the engine
      # ships as lib/<abi>/libphotocraft_cli.so. cargo-ndk copies the binaries it
      # produced itself - except when its library mode gives up after a multi-target
      # build ("No usable artifacts produced by cargo"), which is exactly what
      # happens here: the binaries are fine, they just are not collected. This step
      # finds them wherever the build left them and decides the job's fate.
      - name: Bundle the engine libraries the APK needs
        id: libs
        if: always() && steps.build.outcome == 'success'
        shell: bash
        run: |
          set +e
          NDK="$ANDROID_NDK_HOME"
          LLVM=$(find "$NDK" -name llvm-readelf -type f -print -quit | xargs -r dirname)
          [ -n "$LLVM" ] || echo "::warning::llvm-readelf not found; skipping the ELF report"
          echo "=== what the build left behind ==="
          find engines-android -type f -exec ls -l {} + 2>/dev/null | sort -k9
          for triple in aarch64-linux-android i686-linux-android; do
            ls -l "../photocraft-src/target/$triple/release" 2>/dev/null | grep photocraft-cli
          done
          OK=1
          for pair in "arm64-v8a:aarch64-linux-android" "x86:i686-linux-android"; do
            ABI="${pair%%:*}"; TRIPLE="${pair##*:}"
            SO="engines-android/$ABI/libphotocraft_cli.so"
            if [ ! -s "$SO" ]; then
              for cand in "engines-android/$ABI/photocraft-cli" \
                          "engines-android/$ABI/libphotocraft-cli.so" \
                          "../photocraft-src/target/$TRIPLE/release/photocraft-cli"; do
                if [ -s "$cand" ]; then
                  mkdir -p "engines-android/$ABI"
                  cp "$cand" "$SO"
                  echo "harvested $ABI from $cand"
                  break
                fi
              done
            fi
            if [ ! -s "$SO" ]; then
              echo "::error::no engine binary for $ABI (looked in engines-android/$ABI and target/$TRIPLE/release)"
              OK=0
              continue
            fi
            chmod 755 "$SO"
            echo "--- $ABI ($(stat -c%s "$SO") bytes)"
            file "$SO"
            if [ -n "$LLVM" ]; then
              "$LLVM/llvm-readelf" -d "$SO" | grep -E "NEEDED|SONAME|RUNPATH|RPATH" || true
              # The NDK's C++ runtime is a *shared* library and the engine links it
              # by its bare soname: Android's linker does not search $ORIGIN, so the
              # copy has to sit in the very same directory and the RPATH must be
              # absolute (it already points at the app's nativeLibraryDir).
              if "$LLVM/llvm-readelf" -d "$SO" | grep -q "libc++_shared.so"; then
                cp "$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/$TRIPLE/libc++_shared.so" \
                   "engines-android/$ABI/libc++_shared.so"
                echo "bundled libc++_shared.so next to the $ABI engine"
              fi
            fi
          done
          echo "=== the engine artefact ==="
          find engines-android -type f -exec ls -l {} + | sort -k9
          [ "$OK" = "1" ] || exit 1

      - name: Publish the build log
        if: steps.build.outputs.status != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/ci/publish_log.py --file android-build.log \
            --job-name "Build photocraft-cli (pinned, android)" --title "android engine build" || true

      # The single gate: the engine artefact above is what matters. cargo-ndk's own
      # exit status is only interesting when the harvest found nothing.
      - name: Fail if the engine is incomplete
        if: steps.libs.outcome != 'success'
        shell: bash
        run: |
          echo "::error::cargo-ndk exited with ${{ steps.build.outputs.status }} and no usable engine was found"
          exit 1

      - name: Upload the Android engine
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: photocraft-cli-android
          path: engines-android/

  # ------------------------------------------------------------------- apk
  # Builds the installable Android package: the shared core, the Kivy app, the
  # bundled fonts/i18n and the cross-compiled engine (as lib/<abi>/libphotocraft_cli.so).
  apk:
    name: Build the Android APK
    needs: [engine-android]
    # runs for tags too, where the last step attaches the APK to the release
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    outputs:
      version: ${{ steps.ver.outputs.version }}
      abis: ${{ steps.ver.outputs.abis }}
      safe: ${{ steps.ver.outputs.safe }}
    steps:
      - name: Checkout EasyWalp
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Resolve version and ABIs
        id: ver
        shell: bash
        run: |
          set -e
          if [ "${{ github.ref_type }}" = "tag" ]; then
            V="${{ github.ref_name }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V=""
          fi
          V="${V#v}"
          if [ -z "$V" ]; then
            V=$(python -c "import sys; sys.path.insert(0, 'src'); from easywalp import __version__; print(__version__)")
          fi
          # Tags build what the release page advertises: real phones (arm64-v8a).
          # Branch runs add x86 so the on-device self-test has an APK the emulator
          # can actually run - the two ABIs end up in one APK, and the emulator
          # installs the x86 half of it.
          ABIS="${{ inputs.android_abis }}"
          if [ -z "$ABIS" ]; then
            if [ "${{ github.ref_type }}" = "branch" ]; then
              ABIS="arm64-v8a,x86"
            else
              ABIS="arm64-v8a"
            fi
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "abis=$ABIS" >> "$GITHUB_OUTPUT"
          echo "safe=$(echo "$ABIS" | tr ',' '-')" >> "$GITHUB_OUTPUT"
          echo "EasyWalp $V for $ABIS"

      - name: Locate the Android SDK and NDK
        id: sdk
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}}"
          if [ ! -d "$NDK" ]; then NDK=$(ls -d "$SDK"/ndk/* 2>/dev/null | sort -V | tail -1); fi
          if [ ! -d "$SDK" ]; then echo "::error::no Android SDK found on the runner"; exit 1; fi
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then echo "::error::no Android NDK found on the runner"; exit 1; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "sdk=$SDK" >> "$GITHUB_OUTPUT"
          echo "ndk=$NDK" >> "$GITHUB_OUTPUT"
          echo "sdk: $SDK"; echo "ndk: $NDK"

      - name: Download the Android engine
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: photocraft-cli-android
          path: engines-android

      - name: Install the build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk-headless autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev libltdl-dev
          python -m pip install --upgrade pip
          pip install buildozer "python-for-android==2026.5.9" cython
          buildozer --version

      - name: Check out python-for-android (pinned tag)
        shell: bash
        run: |
          git clone --depth 1 --branch v2026.05.09 https://github.com/kivy/python-for-android.git ../p4a
          git -C ../p4a log --oneline -1

      - name: Assemble the build folder
        shell: bash
        run: |
          python scripts/android/prepare_apk.py \
            --version "${{ steps.ver.outputs.version }}" \
            --abis "${{ steps.ver.outputs.abis }}" \
            --engine-dir engines-android \
            --sdk "${{ steps.sdk.outputs.sdk }}" \
            --ndk "${{ steps.sdk.outputs.ndk }}" \
            --p4a-dir "$GITHUB_WORKSPACE/../p4a" \
            --build-dir android/build/app
          echo "--- rendered spec (differences from android/buildozer.spec) ---"
          diff <(sed -n '1,200p' android/buildozer.spec) <(sed -n '1,200p' android/build/app/buildozer.spec) || true
          echo "--- build folder ---"
          find android/build/app -maxdepth 2 -not -path '*/__pycache__*' | sort | head -40

      - name: Cache the python-for-android build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: android/build/app/.buildozer
          key: p4a-${{ steps.ver.outputs.safe }}-${{ hashFiles('android/buildozer.spec') }}-v2
          restore-keys: p4a-${{ steps.ver.outputs.safe }}-

      # buildozer hardcodes `$SDK/tools/bin/sdkmanager` (the pre-2019 layout) and
      # bails out with "sdkmanager is not installed" when it is missing, so the
      # cmdline-tools copy the runner image ships gets a small shim. Then the SDK
      # gets whatever buildozer/p4a expect to find: the platform the spec targets
      # (p4a refuses to build without it) and platform-tools.
      - name: Make the Android SDK usable by buildozer
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          API=$(grep -E "^android\.api" android/build/app/buildozer.spec | head -1 | tr -dc '0-9')
          echo "spec targets API $API in $SDK"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER=$(command -v sdkmanager || true)
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::no sdkmanager in $SDK"; exit 1
          fi
          echo "sdkmanager: $SDKMANAGER"

          SHIM="$SDK/tools/bin/sdkmanager"
          if [ ! -x "$SHIM" ]; then
            echo "linking $SHIM -> $SDKMANAGER"
            SUDO=""
            [ -w "$SDK" ] || SUDO="sudo"
            $SUDO mkdir -p "$SDK/tools/bin"
            printf '#!/bin/sh\nexec "%s" "$@"\n' "$SDKMANAGER" | $SUDO tee "$SHIM" > /dev/null
            $SUDO chmod +x "$SHIM"
          fi
          "$SHIM" --version || true

          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          MISSING=""
          [ -d "$SDK/platforms/android-$API" ] || MISSING="$MISSING platforms;android-$API"
          [ -d "$SDK/platform-tools" ] || MISSING="$MISSING platform-tools"
          if [ -n "$MISSING" ]; then
            echo "installing:$MISSING"
            "$SDKMANAGER" $MISSING || { echo "::error::could not install:$MISSING"; exit 1; }
          else
            echo "the SDK already has the platform and platform-tools"
          fi
          test -d "$SDK/platforms/android-$API" || { echo "::error::platform $API is still missing"; exit 1; }

          echo "--- platforms ---"; ls "$SDK/platforms"
          echo "--- build-tools ---"; ls "$SDK/build-tools" 2>/dev/null || echo "(none)"
          echo "--- platform-tools ---"; ls "$SDK/platform-tools" 2>/dev/null | head -5 || echo "(none)"

      # p4a resolves every recipe-less dependency with `pip install --dry-run
      # --platform=<android>` and then hands the chosen wheels to the *host* pip,
      # which refuses anything that is not tagged for the running platform. Since
      # charset-normalizer 3.5.0 it publishes cp3xx-android_24_<abi> wheels, so p4a
      # picks one and the install dies with "not a supported wheel on this
      # platform". 3.4.x ships the same pure-python wheel for every platform, and
      # nothing we ship cares which version it gets.
      - name: Constrain the wheels p4a cannot install
        shell: bash
        run: |
          cat > "$GITHUB_WORKSPACE/pip-constraints.txt" <<'EOF'
          charset-normalizer<3.5
          EOF
          echo "PIP_CONSTRAINT=$GITHUB_WORKSPACE/pip-constraints.txt" >> "$GITHUB_ENV"
          cat "$GITHUB_WORKSPACE/pip-constraints.txt"

      # p4a creates a venv with the freshly built hostpython and then upgrades pip
      # inside it. Kept across runs (the build folder is cached) that upgrade leaves
      # the venv with pip files from two different versions and every later run dies
      # on `pip install -U pip` with an ImportError from inside pip itself
      # ("cannot import name 'BuildDependencyInstallError'"). It takes seconds to
      # create again, so it never gets reused. Same for the target installs, which a
      # failed run can leave half-written.
      - name: Drop the python-for-android venv from the cache
        shell: bash
        run: |
          P4A_BUILD=android/build/app/.buildozer/android/platform
          if [ ! -d "$P4A_BUILD" ]; then
            echo "no $P4A_BUILD yet (nothing came out of the cache) - nothing to drop"
            exit 0
          fi
          find "$P4A_BUILD" -maxdepth 4 -type d \( -name venv -o -name python-installs \) -print
          find "$P4A_BUILD" -maxdepth 4 -type d \( -name venv -o -name python-installs \) -exec rm -rf {} +
          find "$P4A_BUILD" -maxdepth 4 -type d \( -name venv -o -name python-installs \) -print

      - name: Build the APK
        id: build
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          set +e
          (
            cd android/build/app
            buildozer -v android debug
          ) > apk-build.log 2>&1
          STATUS=$?
          echo "=== the last 120 lines ==="
          tail -120 apk-build.log
          if [ "$STATUS" != "0" ]; then
            # The step log is readable through the API even when the file is huge.
            echo "=== error-ish lines (last 40) ==="
            grep -n -iE "error|exception|traceback|failed|no such file|cannot find" apk-build.log \
              | tail -40 || true
          fi
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      # A failed build still warms the cache: without this every attempt starts from
      # zero (the automatic cache post-step does not run for a failed job).
      - name: Save the python-for-android build
        if: always()
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: android/build/app/.buildozer
          key: p4a-${{ steps.ver.outputs.safe }}-${{ hashFiles('android/buildozer.spec') }}-v1

      - name: Publish the APK build log
        if: steps.build.outputs.status != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/ci/publish_log.py --file apk-build.log \
            --job-name "Build the Android APK" --title "apk build" || true

      - name: Fail if the build failed
        if: steps.build.outputs.status != '0'
        shell: bash
        run: exit 1

      - name: Inspect the APK
        shell: bash
        run: |
          ls -l android/build/app/bin/ || true
          APK=$(ls android/build/app/bin/*.apk | head -1)
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          unzip -l "$APK" | grep -E "lib/|assets/(fonts|i18n|photocraft)|private" | head -30
          python - <<'PY'
          import zipfile, glob
          apk = glob.glob("android/build/app/bin/*.apk")[0]
          names = zipfile.ZipFile(apk).namelist()
          wanted = [n for n in names if "photocraft" in n or n.startswith("lib/arm64-v8a/lib") or "fonts" in n]
          print("engine + libs:", wanted)
          assert any("photocraft_cli" in n for n in names), "the engine is missing from the APK"
          PY

      - name: Upload the APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: easywalp-apk-${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.safe }}
          path: android/build/app/bin/*.apk

      - name: Attach the APK to the GitHub release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "EasyWalp ${TAG#v}" \
              --notes "EasyWalp ${TAG#v} - Windows installer and Android APK." || true
          fi
          # The README points at EasyWalp-<version>-<abis>.apk, which is not the
          # name buildozer produces, so a copy with that name travels with it.
          mkdir -p release-assets
          APK=$(ls android/build/app/bin/*.apk | head -1)
          TIDY="release-assets/EasyWalp-${TAG#v}-${{ steps.ver.outputs.safe }}.apk"
          cp "$APK" "$TIDY"
          ls -l "$APK" "$TIDY"
          for attempt in 1 2 3 4 5; do
            if gh release upload "$TAG" "$APK" "$TIDY" --clobber; then exit 0; fi
            sleep 15
          done
          echo "::error::could not attach the APK to $TAG"
          exit 1

  # ------------------------------------------------------- on-device self-test
  # Installs the x86 APK on an emulator, pushes a self-test request into the app's
  # external files dir, launches the app and pulls the report back. This is proof
  # that the APK runs: engine, Pillow, PSD editing and the whole generate pipeline,
  # on a real Android runtime rather than on the desktop interpreter.
  android-selftest:
    name: On-device self-test (Android emulator)
    needs: [apk]
    # Branch runs always carry an x86 APK (see "Resolve version and ABIs"), so the
    # self-test does not need a manual dispatch any more. Tag runs ship arm64 only
    # and skip it.
    if: (github.event_name == 'workflow_dispatch' && inputs.android_emulator) || (github.event_name == 'push' && github.ref_type == 'branch')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout EasyWalp
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download the APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: easywalp-apk-${{ needs.apk.outputs.version }}-${{ needs.apk.outputs.safe }}
          path: apk

      - name: Check the APK we got
        shell: bash
        run: |
          ls -l apk
          APK=$(ls apk/*.apk | head -1)
          python - "$APK" <<'PY'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          libs = sorted({n.split("/")[1] for n in names if n.startswith("lib/")})
          print("ABIs in the APK:", libs)
          assert "x86" in libs, "no x86 library in the APK - the emulator cannot run it"
          PY

      - name: Boot an emulator and run the self-test
        id: device
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          PACKAGE: org.wallify.easywalp
        run: |
          set +e
          (
            set -e
            SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
            export PATH="$SDK/platform-tools:$SDK/emulator:$SDK/cmdline-tools/latest/bin:$PATH"
            test -w /dev/kvm && echo "KVM available" || echo "::warning::no /dev/kvm - the emulator will be slow"
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
            sdkmanager --install "platform-tools" "emulator" "system-images;android-30;google_apis;x86" > /dev/null
            echo no | avdmanager create avd -n easywalp -k "system-images;android-30;google_apis;x86" --device "pixel_4" --force
            emulator -avd easywalp -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel auto &
            adb wait-for-device
            for i in $(seq 1 60); do
              if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then break; fi
              sleep 10
            done
            adb shell getprop sys.boot_completed
            APK=$(ls apk/*.apk | head -1)
            echo "installing $APK"
            adb install -r -t "$APK"
            adb shell pm list packages | grep wallify
            adb shell mkdir -p /sdcard/Android/data/$PACKAGE/files/selftest
            adb shell "echo '{\"engine\": true, \"pipeline\": true, \"export\": true, \"ui\": true}' > /sdcard/Android/data/$PACKAGE/files/selftest/request.json"
            adb shell cat /sdcard/Android/data/$PACKAGE/files/selftest/request.json
            adb shell monkey -p $PACKAGE -c android.intent.category.LAUNCHER 1
            echo "--- waiting for the report ---"
            for i in $(seq 1 60); do
              if adb shell "test -f /sdcard/Android/data/$PACKAGE/files/selftest/result.json" 2>/dev/null; then break; fi
              sleep 10
            done
            adb shell cat /sdcard/Android/data/$PACKAGE/files/selftest/result.txt || true
            adb pull /sdcard/Android/data/$PACKAGE/files/selftest/result.json selftest-result.json || true
            adb shell ls -R /sdcard/Android/data/$PACKAGE/files/selftest || true
            adb logcat -d -s python.stdout:V python.stderr:V EasyWalp:V | tail -60 || true
            test -f selftest-result.json
          ) > device-selftest.log 2>&1
          STATUS=$?
          tail -80 device-selftest.log
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Report the self-test
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/ci/publish_log.py --file device-selftest.log \
            --job-name "On-device self-test (Android emulator)" --title "android self-test" || true
          python scripts/android/selftest_report.py selftest-result.json

  # ------------------------------------------------ windows installer smoke test
  # Installs the *shipped* installer on a clean Windows runner - silent install,
  # then start the installed app, read its version back and check that the window
  # stays up. This is what proves "the Windows download runs", the same way
  # `android-selftest` proves it for the APK (the old build-time smoke test only
  # checked the build tree, not what the channel team actually downloads).
  ci:
    name: Windows installer smoke test
    needs: [release-app]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Download the release package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ github.run_id }}
          path: release

      - name: Install it like a user would
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $log = "install-smoke.log"
          function Say($m) { $m | Tee-Object -FilePath $log -Append | Out-Host }

          "== release artefacts ==" | Set-Content $log
          Get-ChildItem -Recurse release | Where-Object { -not $_.PSIsContainer } |
            ForEach-Object { Say ("{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB)) }

          $zip = Get-ChildItem -Recurse release -Filter *.zip | Select-Object -First 1
          if (-not $zip) { Say "::error::no installer zip in the release artefacts"; exit 1 }
          Expand-Archive -Path $zip.FullName -DestinationPath unpacked -Force
          $setup = Get-ChildItem -Recurse unpacked -Filter "EasyWalp-Setup-*.exe" | Select-Object -First 1
          if (-not $setup) { Say "::error::no EasyWalp-Setup-*.exe inside $($zip.Name)"; exit 1 }
          Say "installer: $($setup.FullName) ($([math]::Round($setup.Length / 1MB, 1)) MB)"

          Say "== silent install =="
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" -Wait -PassThru
          Say "installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Say "::error::the installer failed with exit code $($p.ExitCode)"; exit 1 }

          $exe = Get-ChildItem -Recurse "$env:LOCALAPPDATA\Programs" -Filter EasyWalp.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem -Recurse "$env:ProgramFiles" -Filter EasyWalp.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $exe) {
            Say "::error::the installer did not create EasyWalp.exe"
            Get-ChildItem -Recurse "$env:LOCALAPPDATA\Programs" -ErrorAction SilentlyContinue |
              Select-Object -First 40 | ForEach-Object { Say $_.FullName }
            exit 1
          }
          Say "installed: $($exe.FullName) ($([math]::Round($exe.Length / 1MB, 1)) MB)"
          Get-ChildItem $exe.DirectoryName | ForEach-Object { Say ("  " + $_.Name) }

          Say "== the app answers --version =="
          # Windowed exe: use Start-Process -Wait, the call operator neither waits nor
          # sets $LASTEXITCODE for those.
          $vp = Start-Process -FilePath $exe.FullName -ArgumentList "--version" -Wait -PassThru \
            -NoNewWindow -RedirectStandardOutput app-version.txt
          $version = (Get-Content app-version.txt -Raw -ErrorAction SilentlyContinue).Trim()
          Say "EasyWalp.exe --version -> $version (exit $($vp.ExitCode))"
          if ($vp.ExitCode -ne 0) { Say "::error::the installed app exited with $($vp.ExitCode)"; exit 1 }
          if ($version -notmatch "EasyWalp \d") { Say "::error::the installed app could not report its version"; exit 1 }

          $engine = Get-ChildItem -Recurse $exe.DirectoryName -Filter photocraft-cli.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($engine) {
            $ev = (& $engine.FullName --version 2>&1 | Out-String).Trim()
            Say "engine: $($engine.FullName) -> $ev"
          } else {
            Say "::warning::no photocraft-cli.exe shipped next to the app"
          }

          Say "== starting the GUI =="
          $proc = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 20
          if ($proc.HasExited) {
            Say "::error::the GUI exited during startup with code $($proc.ExitCode)"
            Get-ChildItem -Recurse "$env:APPDATA\EasyWalp" -Filter *.log -ErrorAction SilentlyContinue |
              ForEach-Object { Say "--- $($_.FullName)"; Get-Content $_.FullName -Tail 40 | ForEach-Object { Say $_ } }
            exit 1
          }
          Say "the GUI stayed up for 20 s - stopping it"
          $proc.Kill()
          Say "OK"
          exit 0

      - name: Publish the smoke log
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/ci/publish_log.py --file install-smoke.log \
            --job-name "Windows installer smoke test" --title "windows installer smoke" || true

  # ------------------------------------------------------------- release
  release-engine:
    name: "Release: build photocraft-cli (pinned)"
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-latest
    steps:
      - name: Checkout EasyWalp
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read PhotoCraft pin
        id: pin
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const pin = JSON.parse(fs.readFileSync("config/photocraft-pin.json", "utf8")).photocraft;
            for (const [k, v] of Object.entries({ repo: pin.repo, commit: pin.commit, tag: pin.tag, fonts_repo: pin.craft_fonts_repo, fonts_ref: pin.craft_fonts_ref }))
              fs.appendFileSync(process.env.GITHUB_OUTPUT, k + "=" + v + "\n");
          '

      - name: Install Rust (stable, MSVC)
        shell: bash
        run: |
          curl -sSf https://win.rustup.rs/x86_64 -o rustup-init.exe
          ./rustup-init.exe -y --default-toolchain stable --profile minimal
          echo "$USERPROFILE/.cargo/bin" >> "$GITHUB_PATH"

      - name: Check out PhotoCraft (pinned) and craft-fonts (pinned)
        shell: bash
        run: |
          git clone --no-checkout "https://github.com/${{ steps.pin.outputs.repo }}.git" ../photocraft-src
          git -C ../photocraft-src checkout --detach ${{ steps.pin.outputs.commit }}
          git clone "https://github.com/${{ steps.pin.outputs.fonts_repo }}.git" ../craft-fonts
          git -C ../craft-fonts checkout --detach ${{ steps.pin.outputs.fonts_ref }}

      - name: Cache Rust build (keyed by the pin)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ../photocraft-src/target
          key: photocraft-${{ steps.pin.outputs.commit }}-${{ runner.os }}
          restore-keys: photocraft-${{ runner.os }}

      - name: Build photocraft-cli
        shell: bash
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/../craft-fonts
        run: |
          cd ../photocraft-src
          cargo build --release --locked -p photocraft-cli
          cp target/release/photocraft-cli.exe "$GITHUB_WORKSPACE/photocraft-cli.exe"
          cp LICENSE-MIT LICENSE-APACHE NOTICE ATTRIBUTION.md "$GITHUB_WORKSPACE/"

      - name: Smoke test
        shell: bash
        run: |
          ./photocraft-cli.exe --version
          ./photocraft-cli.exe commands --json --filter replaceContents | head -5

      - name: Upload engine artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: photocraft-cli
          path: |
            photocraft-cli.exe
            LICENSE-MIT
            LICENSE-APACHE
            NOTICE
            ATTRIBUTION.md

  release-app:
    name: "Release: app + installer"
    needs: [release-engine]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout EasyWalp
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          V="${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"
          V="${V#v}"
          if [ -z "$V" ]; then echo "::error::no version (pass the workflow_dispatch input or push a v* tag)"; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3

      - name: Download photocraft-cli
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: photocraft-cli
          path: build-staging

      - name: Stage payload (assets, i18n, licenses, engine)
        shell: pwsh
        run: |
          python scripts/release/stage_payload.py `
            --version ${{ steps.ver.outputs.version }} `
            --engine-dir build-staging `
            --dest build/payload

      - name: Build with PyInstaller (onedir)
        shell: pwsh
        run: pyinstaller --noconfirm --clean packaging/windows/easywalp.spec

      - name: Smoke test app + engine
        shell: pwsh
        run: |
          $app = "dist/EasyWalp/EasyWalp.exe"
          $engine = "dist/EasyWalp/_internal/assets/photocraft/photocraft-cli.exe"
          if (-not (Test-Path $app)) { throw "missing $app" }
          if (-not (Test-Path $engine)) { throw "missing $engine" }
          # EasyWalp.exe is a *windowed* binary: PowerShell's call operator does not
          # wait for it and never sets $LASTEXITCODE (it stayed empty, so the check
          # below always threw). Start-Process -Wait gives us the real exit code and
          # the version line the app prints.
          $appProc = Start-Process -FilePath $app -ArgumentList "--version" -Wait -PassThru \
            -NoNewWindow -RedirectStandardOutput app-version.txt
          Get-Content app-version.txt -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
          if ($appProc.ExitCode -ne 0) { throw "the app exited with $($appProc.ExitCode)" }
          & $engine --version
          if ($LASTEXITCODE -ne 0) { throw "the engine exited with $LASTEXITCODE" }

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = (Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" | Select-Object -First 1).FullName }
          & $iscc /DAppVersion=${{ steps.ver.outputs.version }} /DSourceDir="$PWD\dist\EasyWalp" /O"$PWD\installer-out" /F"EasyWalp-Setup-${{ steps.ver.outputs.version }}" packaging/windows/easywalp.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited with $LASTEXITCODE" }
          $built = Get-ChildItem -Recurse -Filter "EasyWalp-Setup-${{ steps.ver.outputs.version }}.exe" -Path . -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $built) { throw "the installer was built but not found" }
          Write-Host "installer: $($built.FullName)"
          New-Item -ItemType Directory -Force -Path installer-out | Out-Null
          Copy-Item $built.FullName "installer-out\EasyWalp-Setup-${{ steps.ver.outputs.version }}.exe" -Force

      - name: Checksums + zip
        shell: pwsh
        run: |
          python scripts/release/package_release.py `
            --version ${{ steps.ver.outputs.version }} `
            --installer "installer-out/EasyWalp-Setup-${{ steps.ver.outputs.version }}.exe" `
            --dist dist/EasyWalp

      - name: Upload release artefacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.run_id }}
          path: |
            release/EasyWalp-Setup-${{ steps.ver.outputs.version }}.exe
            release/EasyWalp-Setup-${{ steps.ver.outputs.version }}-windows.zip
            release/SHA256SUMS.txt

  release-publish:
    name: "Release: publish to GitHub Releases"
    needs: [release-app]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download artefacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ github.run_id }}
          path: release

      - name: Create tag + GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ needs.release-app.outputs.version }}"
          TAG="v$VERSION"
          git fetch --tags --quiet || true
          NOTES=$(git log --pretty=format:"- %s (%h)" -30 2>/dev/null | head -40 || true)
          [ -n "$NOTES" ] || NOTES="- automated release $TAG"
          {
            echo "## EasyWalp $VERSION"
            echo
            echo "$NOTES"
            echo
            echo "Download \`EasyWalp-Setup-$VERSION-windows.zip\`, unzip, run the installer."
            echo "Verify with \`SHA256SUMS.txt\`. The installer is unsigned — see the README's SmartScreen note."
            echo
            echo "Powered by PhotoCraft engine (MIT OR Apache-2.0)."
          } > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "release/EasyWalp-Setup-$VERSION-windows.zip" "release/EasyWalp-Setup-$VERSION.exe" "release/SHA256SUMS.txt" --clobber
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "EasyWalp $VERSION" --notes-file notes.md \
              "release/EasyWalp-Setup-$VERSION-windows.zip" \
              "release/EasyWalp-Setup-$VERSION.exe" \
              "release/SHA256SUMS.txt"
          fi
          echo "Release published: https://github.com/${{ github.repository }}/releases/tag/$TAG"
